name: collector-ci
on:
  pull_request:
    paths:
      - "Dockerfile"
      - "builder.yaml"
      - "processor/**"
      - "versions.env"
      - "scripts/**"
      - "examples/**"
      - ".github/workflows/collector-ci.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "builder.yaml"
      - "processor/**"
      - "versions.env"
      - "scripts/**"
      - "examples/**"
      - ".github/workflows/collector-ci.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: builder.yaml and Dockerfile match versions.env
        run: scripts/check-pins.sh

  linux:
    needs: pins
    # Native runner per arch: the binary is executed below, not just built.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build binaries (linux/${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: binary
          platforms: linux/${{ matrix.arch }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=collector-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=collector-${{ matrix.arch }}

      - name: Components check
        # Fails on any component missing from (or not listed in)
        # scripts/expected-components.txt.
        run: scripts/check-components.sh dist/xscaler-collector

      - name: Validate example configs
        run: scripts/validate-examples.sh dist/xscaler-collector

      - name: Service identity rules (service.name / namespace / version, agent id)
        run: scripts/service-identity-test.sh dist/xscaler-collector

      - name: Smoke test (persistent file_storage queue across a restart)
        run: scripts/smoke-test.sh dist/xscaler-collector

      - name: Supervisor runs
        run: dist/opampsupervisor --help >/dev/null 2>&1 || dist/opampsupervisor --version

      - uses: actions/upload-artifact@v4
        with:
          name: xscaler-collector-linux-${{ matrix.arch }}
          path: dist/*
          retention-days: 7

  cross:
    # The same manifest compiled for the host platforms the packages target.
    needs: pins
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64 }
          - { os: windows, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: freebsd, arch: amd64 }
          - { os: freebsd, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build binaries (${{ matrix.os }}/${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          target: binary
          platforms: ${{ matrix.os }}/${{ matrix.arch }}
          outputs: type=local,dest=dist
          # OBI generate, OCB sources and module downloads all run on the
          # build platform, so the amd64 job's cache covers them.
          cache-from: type=gha,scope=collector-amd64
      - run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: xscaler-collector-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 7

  windows:
    # Run the Windows binary: components, and the Windows example, which only
    # builds on Windows (windows_event_log).
    needs: cross
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xscaler-collector-windows-amd64
          path: dist
      - name: Components check
        run: scripts/check-components.sh dist/xscaler-collector.exe
      - name: Validate windows-host.yaml
        run: scripts/validate-examples.sh dist/xscaler-collector.exe
      - name: Supervisor runs
        run: dist/opampsupervisor.exe --help 2>&1 | head -3

  freebsd:
    # Boot the freebsd/amd64 binary in a FreeBSD VM (KVM on the runner).
    needs: cross
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xscaler-collector-freebsd-amd64
          path: dist
      - run: chmod +x dist/xscaler-collector
      - name: Run in FreeBSD 14
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: "14.3"
          arch: x86_64
          usesh: true
          run: |
            set -eu
            bin="$PWD/dist/xscaler-collector"
            echo "== version"
            "$bin" --version

            echo "== components"
            grep -vE '^[[:space:]]*(#|$)' scripts/expected-components.txt | sort -u >/tmp/expected
            "$bin" components | awk '
              /^[a-z]+:/ { kind = $1; sub(":", "", kind); next }
              kind ~ /^(receivers|processors|exporters|extensions|connectors|providers)$/ &&
                $1 == "-" && $2 == "name:" { print kind, $3 }
              kind ~ /^(receivers|processors|exporters|extensions|connectors|providers)$/ &&
                $1 == "-" && $2 == "scheme:" { print kind, $3 }
            ' | sort -u >/tmp/actual
            if ! diff /tmp/expected /tmp/actual; then
              echo "components MISMATCH"
              exit 1
            fi
            echo "components OK: $(wc -l </tmp/actual | tr -d ' ') match"

            echo "== validate freebsd-host.yaml"
            sed 's/\${xscaler:agent_id}/00000000-0000-0000-0000-000000000000/g' \
              examples/freebsd-host.yaml >/tmp/freebsd-host.yaml
            export XSCALER_TENANT_ID=ci XSCALER_TOKEN=ci
            export XSCALER_METRICS_ENDPOINT=https://ingest.example.invalid/otlp/v1/metrics
            export XSCALER_LOGS_ENDPOINT=https://ingest.example.invalid/otlp/v1/logs
            export XSCALER_TRACES_ENDPOINT=https://ingest.example.invalid/otlp/v1/traces
            export XSCALER_QUEUE_DIR=/tmp/xscaler-validate-queue
            "$bin" validate --config /tmp/freebsd-host.yaml
            echo "validate OK"

            echo "== host_metrics run"
            cat >/tmp/run.yaml <<'CFG'
            receivers:
              host_metrics:
                collection_interval: 5s
                scrapers: { cpu: {}, memory: {} }
            exporters:
              debug:
                verbosity: detailed
            service:
              pipelines:
                metrics:
                  receivers: [host_metrics]
                  exporters: [debug]
            CFG
            timeout 30 "$bin" --config /tmp/run.yaml >/tmp/run.log 2>&1 || true
            if ! grep -qE 'Name: system\.cpu' /tmp/run.log; then
              echo "no system.cpu metric in output"
              tail -50 /tmp/run.log
              exit 1
            fi
            grep -E 'Name: system\.cpu' /tmp/run.log | head -3
            echo "metrics OK"

  image:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: xscaler-collector:ci
          cache-from: |
            type=gha,scope=collector-amd64
            type=gha,scope=collector-arm64
      - name: Load amd64 image and check it
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: xscaler-collector:ci
          cache-from: type=gha,scope=collector-amd64
      - name: Image entrypoint, binaries and legacy path
        run: |
          docker run --rm --entrypoint xscaler-collector xscaler-collector:ci --version
          docker run --rm --entrypoint otelcol-contrib xscaler-collector:ci --version
          docker run --rm --entrypoint /bin/sh xscaler-collector:ci -c 'id -u; command -v opampsupervisor'
