# eBPF auto-instrumentation (the collector's `obi` receiver) needs these
# capabilities (the same set the chart grants the node agent). Off by
# default. To enable:
#
#   mkdir -p /etc/systemd/system/xscaler-collector.service.d
#   ln -s /usr/share/xscaler-collector/ebpf.conf \
#     /etc/systemd/system/xscaler-collector.service.d/ebpf.conf
#   systemctl daemon-reload && systemctl restart xscaler-collector
#
# The supervisor passes its capabilities on to the collector through the
# ambient set. Also needs bpffs mounted at /sys/fs/bpf and a kernel with BTF.
[Service]
AmbientCapabilities=CAP_BPF CAP_PERFMON CAP_SYS_ADMIN CAP_SYS_PTRACE CAP_NET_RAW CAP_DAC_READ_SEARCH CAP_CHECKPOINT_RESTORE
CapabilityBoundingSet=CAP_BPF CAP_PERFMON CAP_SYS_ADMIN CAP_SYS_PTRACE CAP_NET_RAW CAP_DAC_READ_SEARCH CAP_CHECKPOINT_RESTORE
LimitMEMLOCK=infinity
