# Node DaemonSet (one pod per node).
#
# Everything a workload on this node emits leaves with the service identity
# the service model is built from:
#   service.name       SDK value, else the pod's app.kubernetes.io/name label,
#                      else the owning workload (deployment, statefulset,
#                      daemonset, cronjob, job). Never a fixed name, never the
#                      pod name.
#   service.namespace  the Kubernetes namespace.
#   service.version    SDK value, else app.kubernetes.io/version.
#   k8s.*              cluster, namespace, workload, pod, node, on logs,
#                      metrics and traces alike.
#   xscaler.agent.id   the agent-api id of the collector that saw it. agent-api
#                      fills in ${xscaler:agent_id} when it pushes the config.
#
# Node-level infrastructure (host metrics) runs in its own metrics/infra
# pipeline and carries no service.name: a node is not a service.
#
# eBPF is an overlay: add --config node-daemonset-ebpf.yaml where the pod is
# granted BPF privileges.
#
# Env the pod provides: K8S_NODE_NAME, K8S_NODE_IP (downward API),
# XSCALER_{METRICS,LOGS,TRACES}_ENDPOINT, XSCALER_TOKEN, XSCALER_TENANT_ID,
# XSCALER_CLUSTER_NAME, XSCALER_QUEUE_DIR.

extensions:
  health_check: { endpoint: "0.0.0.0:13133" }
  # The sending queues and file_log offsets live here. Put it on a hostPath
  # (or the chart's storage volume) so queued data survives a pod restart.
  file_storage:
    directory: ${env:XSCALER_QUEUE_DIR:-/var/lib/xscaler-collector/queue}
    create_directory: true
    timeout: 1s

receivers:
  otlp:
    protocols:
      grpc: { endpoint: "0.0.0.0:4317" }
      http: { endpoint: "0.0.0.0:4318" }
  kubelet_stats:
    collection_interval: 60s
    auth_type: serviceAccount
    # Unbracketed: Go 1.26+ rejects a bracketed IPv4 literal. IPv6-only nodes
    # need "https://[${env:K8S_NODE_IP}]:10250".
    endpoint: "https://${env:K8S_NODE_IP}:10250"
    insecure_skip_verify: true
    metric_groups: [node, pod, container, volume]
  host_metrics:
    collection_interval: 60s
    scrapers: { cpu: {}, memory: {}, load: {}, filesystem: {}, network: {}, disk: {}, paging: {} }
  file_log:
    include: [/var/log/pods/*/*/*.log]
    include_file_path: true
    start_at: end
    storage: file_storage
    operators:
      # Parses docker / containerd / CRI-O lines and sets k8s.namespace.name,
      # k8s.pod.name, k8s.pod.uid and k8s.container.name from the file path,
      # so k8s_attributes joins the log to the same pod and workload a trace
      # from that pod gets.
      - type: container
        id: container-parser

processors:
  # Percentages of the cgroup memory limit, so the limiter always sits below
  # the pod limit whatever the chart sets (512Mi -> hard 409Mi, soft 307Mi).
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  k8s_attributes:
    auth_type: serviceAccount
    # Only this node's pods: one small watch per DaemonSet pod.
    filter:
      node_from_env_var: K8S_NODE_NAME
    passthrough: false
    pod_association:
      # Pod logs (container parser) and kubelet_stats pod/container metrics.
      - sources: [{ from: resource_attribute, name: k8s.pod.uid }]
      # OBI and SDKs that set pod name + namespace.
      - sources:
          - { from: resource_attribute, name: k8s.pod.name }
          - { from: resource_attribute, name: k8s.namespace.name }
      # OTLP: whatever the SDK sent, then the peer address.
      - sources: [{ from: resource_attribute, name: k8s.pod.ip }]
      - sources: [{ from: connection }]
    extract:
      # No service.* here on purpose: upstream ranks app.kubernetes.io/instance
      # (usually the Helm release) above app.kubernetes.io/name and falls back
      # to the pod name. transform/xscaler_service applies our order instead.
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.node.name
        - k8s.deployment.name
        - k8s.replicaset.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.cronjob.name
        - k8s.job.name
        - container.image.name
        - container.image.tag
      labels:
        - { tag_name: xscaler.k8s.app.name, key: app.kubernetes.io/name, from: pod }
        - { tag_name: xscaler.k8s.app.version, key: app.kubernetes.io/version, from: pod }

  # service.name / service.namespace / service.version in the order the service
  # model expects. `unknown_service:<process>` is an SDK default nobody chose,
  # so it is replaced when a better name exists and kept otherwise.
  transform/xscaler_service:
    error_mode: ignore
    log_statements: &service_statements
      - context: resource
        statements:
          - set(resource.attributes["service.name"], resource.attributes["xscaler.k8s.app.name"]) where (resource.attributes["service.name"] == nil or IsMatch(resource.attributes["service.name"], "^unknown_service")) and resource.attributes["xscaler.k8s.app.name"] != nil
          - set(resource.attributes["service.name"], resource.attributes["k8s.deployment.name"]) where (resource.attributes["service.name"] == nil or IsMatch(resource.attributes["service.name"], "^unknown_service")) and resource.attributes["k8s.deployment.name"] != nil
          - set(resource.attributes["service.name"], resource.attributes["k8s.statefulset.name"]) where (resource.attributes["service.name"] == nil or IsMatch(resource.attributes["service.name"], "^unknown_service")) and resource.attributes["k8s.statefulset.name"] != nil
          - set(resource.attributes["service.name"], resource.attributes["k8s.daemonset.name"]) where (resource.attributes["service.name"] == nil or IsMatch(resource.attributes["service.name"], "^unknown_service")) and resource.attributes["k8s.daemonset.name"] != nil
          - set(resource.attributes["service.name"], resource.attributes["k8s.cronjob.name"]) where (resource.attributes["service.name"] == nil or IsMatch(resource.attributes["service.name"], "^unknown_service")) and resource.attributes["k8s.cronjob.name"] != nil
          - set(resource.attributes["service.name"], resource.attributes["k8s.job.name"]) where (resource.attributes["service.name"] == nil or IsMatch(resource.attributes["service.name"], "^unknown_service")) and resource.attributes["k8s.job.name"] != nil
          - set(resource.attributes["service.namespace"], resource.attributes["k8s.namespace.name"]) where resource.attributes["service.namespace"] == nil and resource.attributes["k8s.namespace.name"] != nil
          - set(resource.attributes["service.version"], resource.attributes["xscaler.k8s.app.version"]) where resource.attributes["service.version"] == nil and resource.attributes["xscaler.k8s.app.version"] != nil
          - delete_key(resource.attributes, "xscaler.k8s.app.name")
          - delete_key(resource.attributes, "xscaler.k8s.app.version")
    metric_statements: *service_statements
    trace_statements: *service_statements

  # Who saw it. host.name is inserted only: an SDK's own host.name stays.
  resource/xscaler_agent:
    attributes:
      - { key: xscaler.agent.id, value: "${xscaler:agent_id}", action: upsert }
      - { key: xscaler.agent.profile, value: k8s_node, action: upsert }
      - { key: k8s.cluster.name, value: "${env:XSCALER_CLUSTER_NAME}", action: upsert }
      - { key: k8s.node.name, value: "${env:K8S_NODE_NAME}", action: upsert }
      - { key: host.name, value: "${env:K8S_NODE_NAME}", action: insert }

  batch: { timeout: 5s, send_batch_size: 512 }

exporters:
  otlp_http/metrics:
    metrics_endpoint: ${env:XSCALER_METRICS_ENDPOINT}
    headers: &auth
      Authorization: "Bearer ${env:XSCALER_TOKEN}"
      X-Scope-OrgID: "${env:XSCALER_TENANT_ID}"
    sending_queue: &queue
      enabled: true
      storage: file_storage
    retry_on_failure: &retry
      enabled: true
      max_elapsed_time: 0
  otlp_http/logs:
    logs_endpoint: ${env:XSCALER_LOGS_ENDPOINT}
    headers: *auth
    sending_queue: *queue
    retry_on_failure: *retry
  otlp_http/traces:
    traces_endpoint: ${env:XSCALER_TRACES_ENDPOINT}
    headers: *auth
    sending_queue: *queue
    retry_on_failure: *retry

service:
  extensions: [health_check, file_storage]
  pipelines:
    # Workload telemetry: every pipeline gets k8s_attributes and the service
    # identity, in that order.
    metrics:
      receivers: [kubelet_stats, otlp]
      processors: [memory_limiter, k8s_attributes, transform/xscaler_service, resource/xscaler_agent, batch]
      exporters: [otlp_http/metrics]
    logs:
      receivers: [file_log, otlp]
      processors: [memory_limiter, k8s_attributes, transform/xscaler_service, resource/xscaler_agent, batch]
      exporters: [otlp_http/logs]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, k8s_attributes, transform/xscaler_service, resource/xscaler_agent, batch]
      exporters: [otlp_http/traces]
    metrics/infra:
      receivers: [host_metrics]
      processors: [memory_limiter, resource/xscaler_agent, batch]
      exporters: [otlp_http/metrics]
  telemetry:
    metrics:
      readers:
        - pull: { exporter: { prometheus: { host: 0.0.0.0, port: 8888 } } }
